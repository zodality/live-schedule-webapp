<!DOCTYPE html>
<html>
<head>
  <title>Queue Dashboard</title>
</head>

<body>

<h2>📊 Queue Dashboard</h2>

<table border="1" id="table"></table>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzWOV0oIy2p1tsBhSQNtABhBWKQ1o3TS09JTX7p1IBNCoLqoQ9SptE6jZ8joN0zRPAi/exec";

let conflicts = [];

async function loadConflicts(){
  const res = await fetch(URL+"?action=getConflicts");
  conflicts = await res.json();
}

function isConflict(row){
  return conflicts.some(c =>
    c.a.Date === row.Date &&
    c.a['Start Time'] === row['Start Time'] &&
    c.a['คนไลฟ์'] === row['คนไลฟ์']
  );
}

async function loadTable(){
  const res = await fetch(URL+"?action=getRows");
  const data = await res.json();

  const table = document.getElementById('table');

  table.innerHTML = `
    <tr>
      <th>Date</th>
      <th>Start</th>
      <th>End</th>
      <th>Room</th>
      <th>Streamer</th>
      <th>Brand</th>
    </tr>
  `;

  data.forEach(r=>{
    const red = isConflict(r);

    table.innerHTML += `
      <tr style="background:${red?'#ffb3b3':''}">
        <td>${r.Date}</td>
        <td>${r['Start Time']}</td>
        <td>${r['End Time']}</td>
        <td>${r['ห้องสตู']}</td>
        <td>${r['คนไลฟ์']}</td>
        <td>${r.BRAND}</td>
      </tr>
    `;
  });
}

async function init(){
  await loadConflicts();
  await loadTable();
}

init();

</script>

</body>
</html>
