<!DOCTYPE html>
<html>
<head>
  <title>Queue Dashboard</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; color: #202124; }
    h2 { margin: 0 0 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 10px; text-align: left; }
    th { background: #f1f3f4; font-size: 12px; color: #5f6368; }
    tr:nth-child(even) td { background: #fafbfc; }

    /* ===== Status bar (loading / error / done) ===== */
    #status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 8px;
      font-size: 14px;
    }
    #status.show           { display: flex; }
    #status.loading        { background: #e8f0fe; color: #1a73e8; }
    #status.error          { background: #fce8e6; color: #d93025; }
    #status.done           { background: #e6f4ea; color: #137333; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-retry {
      margin-left: auto;
      padding: 4px 14px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .status-retry:hover  { background: #1557b0; }
    .status-retry:active { background: #0d47a1; }

    /* Skeleton ตอน loading — ให้ดูเหมือนมี content เร็ว ๆ */
    #table.skeleton { opacity: 0.4; pointer-events: none; }
  </style>

</head>

<body>

<h2>📊 Queue Dashboard</h2>

<div id="status" aria-live="polite"></div>
<table border="1" id="table"></table>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzWOV0oIy2p1tsBhSQNtABhBWKQ1o3TS09JTX7p1IBNCoLqoQ9SptE6jZ8joN0zRPAi/exec";

let conflicts = [];

// ====== Status helper ======
function setStatus(text, kind) {
  const el = document.getElementById('status');
  if (!el) return;

  // 'hidden' → ซ่อน status bar
  if (kind === 'hidden') {
    el.className = '';
    el.innerHTML = '';
    return;
  }

  // ปกติ: loading / error / done
  el.className = 'show ' + (kind || 'loading');
  const spinner = (kind === 'loading' || !kind) ? '<span class="spinner" aria-hidden="true"></span>' : '';
  const retry   = (kind === 'error') ? '<button class="status-retry" type="button" onclick="init()">Retry</button>' : '';
  el.innerHTML  = spinner + '<span>' + escapeText(text) + '</span>' + retry;
}

function escapeText(s) {
  const d = document.createElement('div');
  d.innerText = String(s == null ? '' : s);
  return d.innerHTML;
}

// ====== Fetch with timeout ======
async function fetchJSON(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Request timeout');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// ====== Data loaders ======
async function loadConflicts() {
  conflicts = await fetchJSON(URL + "?action=getConflicts");
}

function isConflict(row) {
  return conflicts.some(c =>
    c.a.Date === row.Date &&
    c.a['Start Time'] === row['Start Time'] &&
    c.a['คนไลฟ์'] === row['คนไลฟ์']
  );
}

async function loadTable() {
  const data = await fetchJSON(URL + "?action=getRows");

  // Build HTML string ครั้งเดียว — เร็วกว่า += ใน loop หลายเท่า (ไม่ trigger reflow ทุก row)
  const cells = [];
  cells.push('<tr><th>Date</th><th>Start</th><th>End</th><th>Room</th><th>Streamer</th><th>Brand</th></tr>');

  data.forEach(r => {
    const red = isConflict(r);
    const bg  = red ? ' style="background:#ffb3b3"' : '';
    cells.push(
      '<tr' + bg + '>' +
        '<td>' + escapeText(r.Date)            + '</td>' +
        '<td>' + escapeText(r['Start Time'])   + '</td>' +
        '<td>' + escapeText(r['End Time'])     + '</td>' +
        '<td>' + escapeText(r['ห้องสตู'])     + '</td>' +
        '<td>' + escapeText(r['คนไลฟ์'])      + '</td>' +
        '<td>' + escapeText(r.BRAND)           + '</td>' +
      '</tr>'
    );
  });

  document.getElementById('table').innerHTML = cells.join('');
  return data.length;
}

// ====== Init flow with progress + error handling ======
async function init() {
  const tableEl = document.getElementById('table');
  if (tableEl) tableEl.classList.add('skeleton');

  try {
    setStatus('Connecting to backend...', 'loading');

    // 🔥 โหลดพร้อมกัน
    const [_, count] = await Promise.all([
      loadConflicts(),
      loadTable()
    ]);

    if (tableEl) tableEl.classList.remove('skeleton');

    setStatus('Loaded ' + count + ' rows', 'done');
    setTimeout(() => setStatus('', 'hidden'), 2000);

  } catch (err) {
    console.error('[init]', err);
    if (tableEl) tableEl.classList.remove('skeleton');
    setStatus('Failed to load: ' + (err.message || err), 'error');
  }
}

init();

</script>

</body>
</html>
